<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Schema Override - Lunch Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #1a202c;
            font-size: 24px;
            margin-bottom: 16px;
        }
        
        p {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .status.found {
            background: #fed7d7;
            color: #c53030;
        }
        
        .status.not-found {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.cleared {
            background: #bee3f8;
            color: #2c5282;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 8px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background: #e2e8f0;
            color: #2d3748;
        }
        
        .code {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #2d3748;
            overflow-x: auto;
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔧</div>
        <h1>Fix Wizard Step Order</h1>
        <p>This tool will clear the old schema override and restore the correct step order.</p>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div>
            <button onclick="checkStatus()">Check Status</button>
            <button onclick="clearOverride()">Clear Override</button>
            <button class="secondary" onclick="goToApp()">Open App</button>
        </div>
        
        <div id="info" style="margin-top: 30px; display: none;">
            <p style="font-size: 14px; color: #718096;">
                <strong>What this does:</strong><br>
                Removes the <code style="background: #edf2f7; padding: 2px 6px; border-radius: 4px;">planner_schema_override</code> from localStorage.
            </p>
        </div>
    </div>

    <script>
        function checkStatus() {
            const override = localStorage.getItem('planner_schema_override');
            const statusEl = document.getElementById('status');
            const infoEl = document.getElementById('info');
            
            statusEl.style.display = 'block';
            infoEl.style.display = 'block';
            
            if (override) {
                try {
                    const schema = JSON.parse(override);
                    const firstStep = schema.steps && schema.steps[0] ? schema.steps[0].id : 'unknown';
                    
                    statusEl.className = 'status found';
                    statusEl.innerHTML = `
                        ⚠️ <strong>Override found!</strong><br>
                        First step: <code style="background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px;">${firstStep}</code><br>
                        <small>Click "Clear Override" to fix.</small>
                    `;
                } catch (e) {
                    statusEl.className = 'status found';
                    statusEl.textContent = '⚠️ Invalid override found. Click "Clear Override" to remove.';
                }
            } else {
                statusEl.className = 'status not-found';
                statusEl.innerHTML = '✅ <strong>No override found!</strong><br>App will use the correct step order from file.';
            }
        }
        
        function clearOverride() {
            try {
                localStorage.removeItem('planner_schema_override');
                
                const statusEl = document.getElementById('status');
                statusEl.style.display = 'block';
                statusEl.className = 'status cleared';
                statusEl.innerHTML = '✅ <strong>Override cleared!</strong><br>Refresh your app to see the correct step order.';
                
                setTimeout(() => {
                    if (confirm('Override cleared! Open the app now?')) {
                        goToApp();
                    }
                }, 1000);
            } catch (e) {
                alert('Error clearing override: ' + e.message);
            }
        }
        
        function goToApp() {
            window.open('http://localhost:3000', '_blank');
        }
        
        // Auto-check on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
